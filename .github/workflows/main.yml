name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew build --no-daemon

      - name: Zip resource pack
        run: |
          cd pack
          zip -qr ../cicada-pack.zip .
          cd ..
          echo "Pack SHA-1: $(sha1sum cicada-pack.zip | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: CicadaPlugin
          path: build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: cicada-pack
          path: cicada-pack.zip
